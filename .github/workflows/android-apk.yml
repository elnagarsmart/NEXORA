name: Build NEXORA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build installable Android APK
        run: |
          flet build apk --product "NEXORA" --org "com.elnagarsmart" --bundle-id "com.elnagarsmart.nexora" --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Android-APK
          path: build/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
